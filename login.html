<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oversky - Login</title>

<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background-color: #000;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .sign-in-section {
    background: rgba(255 255 255 / 0.1);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 2rem;
    max-width: 400px;
    width: 90%;
    box-shadow: 0 8px 24px rgba(255 255 255 / 0.1);
  }

  h3 {
    text-align: center;
    margin-bottom: 1rem;
    font-size: 1.8rem;
  }

  .form-group { margin-bottom: 1rem; }

  label { font-weight: 600; }

  input {
    width: 100%;
    padding: 0.75rem 1rem;
    border-radius: 12px;
    border: none;
    background: rgba(255 255 255 / 0.07);
    color: white;
  }

  .btn-submit {
    width: 100%;
    padding: 0.85rem;
    background: white;
    color: black;
    font-weight: 700;
    border-radius: 12px;
    cursor: pointer;
  }

  .btn-submit:hover {
    background: #ddd;
  }

  .back-to-home {
    display: block;
    margin-top: 1rem;
    text-align: center;
    color: white;
  }
</style>

</head>
<body>

<section class="sign-in-section">
  <h3>Sign in to Oversky</h3>

  <form id="login-form">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" name="email" required />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" name="password" required />
    </div>

    <button type="submit" class="btn-submit">Login</button>
  </form>

  <a href="index.html" class="back-to-home">Back to Home</a>
</section>


<!-- Supabase Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// =============================================
// 1. KONFIGURASI SUPABASE (GANTI BAGIAN INI)
// =============================================
const supabaseClient = supabase.createClient(
  "https://ryomejcknromjxtfcjhh.supabase.co",       // ← GANTI
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5b21lamNrbnJvbWp4dGZjamhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUzODAxMDMsImV4cCI6MjA4MDk1NjEwM30.gRGbrsQ-0X5k0k2Wp4kISTCUKlK_kXC3abN-X3S8hWI"                       // ← GANTI
);

// =============================================
// 2. FUNGSI LOGIN
// =============================================
document.getElementById("login-form").addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("login-email").value;
    const password = document.getElementById("login-password").value;

    // Login via Supabase Auth
    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        alert("Login gagal: " + error.message);
        return;
    }

    // Jika login sukses
    alert("Login berhasil!");

    // Redirect ke dashboard (ubah jika perlu)
    window.location.href = "customer/menu.html";
});
</script>

</body>
</html>
