<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oversky - Login</title>

<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background-color: #000;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .sign-in-section {
    background: rgba(255 255 255 / 0.1);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 2rem;
    max-width: 400px;
    width: 90%;
    box-shadow: 0 8px 24px rgba(255 255 255 / 0.1);
  }

  h3 {
    text-align: center;
    margin-bottom: 1rem;
    font-size: 1.8rem;
  }

  .form-group { margin-bottom: 1rem; }

  label { font-weight: 600; }

  input {
    width: 100%;
    padding: 0.75rem 1rem;
    border-radius: 12px;
    border: none;
    background: rgba(255 255 255 / 0.07);
    color: white;
  }

  .btn-submit {
    width: 100%;
    padding: 0.85rem;
    background: white;
    color: black;
    font-weight: 700;
    border-radius: 12px;
    cursor: pointer;
  }

  .btn-submit:hover { background: #ddd; }

  .back-to-home {
    display: block;
    margin-top: 1rem;
    text-align: center;
    color: white;
  }
</style>
</head>

<body>

<section class="sign-in-section">
  <h3>Sign in to Oversky</h3>

  <form id="login-form">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" name="email" required />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" name="password" required />
    </div>

    <button type="submit" class="btn-submit">Login</button>
  </form>

  <a href="index.html" class="back-to-home">Back to Home</a>
</section>

<script>
document.getElementById("login-form").addEventListener("submit", function(event) {
    event.preventDefault();

    const formData = new FormData();
    formData.append("email", document.getElementById("login-email").value);
    formData.append("password", document.getElementById("login-password").value);

    fetch("login.php", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {

        if (data.status === "admin") {
            alert("Login Admin Berhasil!");
            window.location.href = "admin/admin.php"; // FIXED
        }
        else if (data.status === "success") {
            alert("Login berhasil!");
            window.location.href = "Menu.html"; // FIXED
        }
        else {
            alert(data.message);
        }

    })
    .catch(err => {
        alert("Terjadi kesalahan server.");
        console.log(err);
    });
});
</script>

</body>
</html>
