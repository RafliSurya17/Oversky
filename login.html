<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oversky - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background-color: #000;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .sign-in-section {
    background: rgba(255 255 255 / 0.1);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 2rem;
    max-width: 400px;
    width: 90%;
    box-shadow: 0 8px 24px rgba(255 255 255 / 0.1);
  }

  h3 {
    text-align: center;
    margin-bottom: 1rem;
    font-size: 1.8rem;
  }

  input {
    width: 100%;
    padding: 0.75rem 1rem;
    border-radius: 12px;
    border: none;
    background: rgba(255 255 255 / 0.07);
    color: white;
    margin-bottom: 1rem;
  }

  .btn-submit {
    width: 100%;
    padding: 0.85rem;
    background: white;
    color: black;
    font-weight: 700;
    border-radius: 12px;
    cursor: pointer;
  }

  .btn-submit:hover { background: #ddd; }
</style>
</head>

<body>

<section class="sign-in-section">
  <h3>Sign in to Oversky</h3>

  <input type="email" id="email" placeholder="Email" required />
  <input type="password" id="password" placeholder="Password" required />
  <button class="btn-submit" id="loginBtn">Login</button>
</section>

<script>
// ====== CONNECT TO SUPABASE ======
const supabaseClient = supabase.createClient(
  "https://ryomejcknromjxtfcjhh.supabase.co",       // ← GANTI
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5b21lamNrbnJvbWp4dGZjamhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUzODAxMDMsImV4cCI6MjA4MDk1NjEwM30.gRGbrsQ-0X5k0k2Wp4kISTCUKlK_kXC3abN-X3S8hWI"                       // ← GANTI
);

document.getElementById("loginBtn").addEventListener("click", async () => {
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  // LOGIN VIA SUPABASE AUTH
  const { data: authData, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    alert("Login gagal: " + error.message);
    return;
  }

  // CEK ROLE USER DI TABLE users
  const { data: userRows } = await supabaseClient
    .from("users")
    .select("role")
    .eq("email", email)
    .single();

  if (!userRows) {
    alert("Akun tidak ditemukan dalam tabel users!");
    return;
  }

  let role = userRows.role;

  // REDIRECT BERDASARKAN ROLE
  if (role === "admin") {
    alert("Selamat datang Admin!");
    window.location.href = "admin/admin.html"; 
  } else {
    alert("Login pelanggan berhasil!");
    window.location.href = "customer/menu.html";
  }
});
</script>

</body>
</html>
